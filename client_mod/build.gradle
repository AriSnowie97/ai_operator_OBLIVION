plugins {
    id 'fabric-loom' version '1.8.12'
    id 'maven-publish'
}

version = '1.0.0'
group = 'dev.aioperator'

base {
    archivesName = 'ai-operator-client'
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.terraformersmc.com/releases/' }
    maven { url 'https://api.modrinth.com/maven' }
    mavenCentral()
}



dependencies {
    minecraft "com.mojang:minecraft:1.21.4"
    mappings "net.fabricmc:yarn:1.21.4+build.8:v2"
    modImplementation "net.fabricmc:fabric-loader:0.16.10"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.114.0+1.21.4"

    // Gson для JSON (уже есть в Minecraft, но явно подключаем)
    implementation 'com.google.code.gson:gson:2.10.1'
}

processResources {
    inputs.property 'version', project.version
    filteringCharset 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    archiveClassifier = ''
    destinationDirectory = layout.buildDirectory.dir('libs')
}

remapJar {
    enabled = false
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}
