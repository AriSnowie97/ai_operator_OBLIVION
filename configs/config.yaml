# AI Camera Operator Configuration
server:
  host: "0.0.0.0"
  port: 8000
  secret_token: "obl-operator-secret-2026"
  enable_cors: true

mcp:
  name: "Minecraft Camera Operator"
  version: "1.0.0"

roles:
  admin:
    rate_limit_per_sec: 100
    allow_shaders: true
    allow_emergency_reset: true
    allow_blacklist_bypass: true
  streamer:
    rate_limit_per_sec: 2.0  # 1 command per 0.5s
    allow_shaders: false
    allow_emergency_reset: true
    allow_blacklist_bypass: false
  ai_agent:
    rate_limit_per_sec: 5.0  # Max 5 commands per sec
    allow_shaders: true
    allow_emergency_reset: false
    allow_blacklist_bypass: false
  viewer:
    rate_limit_per_sec: 0.0  # Read-only
    allow_shaders: false
    allow_emergency_reset: false
    allow_blacklist_bypass: false

safety:
  world_clamp:
    min_x: -10000.0
    max_x: 10000.0
    min_y: -64.0
    max_y: 320.0
    min_z: -10000.0
    max_z: 10000.0
  safe_spawn_waypoint: "safe_spawn"
  max_instant_jump_distance: 250.0  # Cooldown or deny if leap is too massive without smooth glide

obs:
  enabled: true
  websocket_url: "ws://localhost:4455"
  password: ""
  scene_name: "Minecraft Camera"
